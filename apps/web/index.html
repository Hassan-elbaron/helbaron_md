      #hb-boot-splash{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;pointer-events:none;transition:opacity .32s ease,transform .32s ease;
        --ink1:#26262a;--ink2:#050506;--steel1:#9a9a9f;--steel2:#55555b;--boot-text:#111114;background:#ffffff}
      :root[data-scheme="dark"] #hb-boot-splash{--ink1:#fff;--ink2:#d4d4d8;--steel1:#cfcfd4;--steel2:#7c7c83;--boot-text:#f4f4f6;background:#1e1e1e}
      @media (prefers-color-scheme:dark){:root:not([data-scheme="light"]) #hb-boot-splash{--ink1:#fff;--ink2:#d4d4d8;--steel1:#cfcfd4;--steel2:#7c7c83;--boot-text:#f4f4f6;background:#1e1e1e}}
      :root[data-window="settings"] #hb-boot-splash{display:none}
      #hb-boot-splash[data-phase="fade"]{opacity:0;transform:scale(1.03)}
      #hb-boot-splash .hb-boot-stack{display:flex;flex-direction:column;align-items:center;gap:22px}
      #hb-boot-splash svg{width:132px;height:132px;overflow:visible}
      #hb-boot-splash :is(.b-top,.b-bot,.ring,.star,.pt,.dot){transform-box:view-box;transform-origin:1000px 1000px}
      #hb-boot-splash .ripple,#hb-boot-splash .ring-arc,#hb-boot-splash .shine-wrap{opacity:0}
      #hb-boot-splash .b-top{animation:hbb-in .5s cubic-bezier(.16,1,.3,1) both}
      #hb-boot-splash .b-bot{animation:hbb-in .5s .05s cubic-bezier(.16,1,.3,1) both}
      #hb-boot-splash .ring{animation:hbb-ring .55s .1s cubic-bezier(.16,1,.3,1) both}
      #hb-boot-splash .star{animation:hbb-cal 1s .15s cubic-bezier(.16,1,.3,1) both,hbb-spin 2.4s 1.4s linear infinite}
      #hb-boot-splash .dot{animation:hbb-pop .5s .45s cubic-bezier(.34,1.56,.64,1) both,hbb-glow 1.4s 1.1s ease-in-out infinite}
      #hb-boot-splash .hb-boot-word{direction:ltr;font:600 30px/1 "hb-boot-wordmark","Segoe UI",system-ui,sans-serif;letter-spacing:.04em;color:var(--boot-text);animation:hbb-fade .5s .55s cubic-bezier(.16,1,.3,1) both}
      #hb-boot-splash .hb-boot-word b{color:#d90a16;font-weight:600}
      @keyframes hbb-in{from{opacity:0;transform:translateX(-90px)}to{opacity:1;transform:none}}
      @keyframes hbb-ring{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
      @keyframes hbb-cal{0%{opacity:0;transform:rotate(-150deg) scale(.5)}45%{opacity:1;transform:rotate(16deg) scale(1.04)}70%{transform:rotate(-6deg)}86%{transform:rotate(2deg)}100%{opacity:1;transform:none}}
      @keyframes hbb-spin{to{transform:rotate(360deg)}}
      @keyframes hbb-pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:none}}
      @keyframes hbb-glow{0%,100%{opacity:.6;filter:none}50%{opacity:1;filter:drop-shadow(0 0 70px #ff2a33) brightness(1.25)}}
      @keyframes hbb-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){#hb-boot-splash *{animation-duration:.01ms!important;animation-iteration-count:1!important}}
    </style>
  </head>
  <body>
    <div id="hb-boot-splash" aria-hidden="true"><div class="hb-boot-stack"><svg viewBox="0 0 2000 2000"><defs>
<linearGradient id="ink-boot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ink1)"/><stop offset="1" style="stop-color:var(--ink2)"/></linearGradient>
<radialGradient id="dot-boot" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#FF4B4F"/><stop offset="0.55" stop-color="#D90A16"/><stop offset="1" stop-color="#9E040D"/></radialGradient>
<linearGradient id="redL-boot"><stop offset="0" stop-color="#FF3B40"/><stop offset="1" stop-color="#E0101B"/></linearGradient>
