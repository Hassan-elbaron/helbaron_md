name: CI

on:
  push:
    branches:
      - main
      - v2
  pull_request:
    branches:
      - main
      - v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    name: Release Tools
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install release tooling dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter helbaron-workspace

      - name: Test release tools
        run: pnpm test:release

  frontend-tests:
    name: Frontend Tests (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: "@helbaron/desktop"
            package: "@helbaron/desktop"
            args: ""
            shard: ""
          - label: "@helbaron/web"
            package: "@helbaron/web"
            args: ""
            shard: ""
          - label: "@helbaron/ai"
            package: "@helbaron/ai"
            args: ""
            shard: ""
          - label: "@helbaron/app, workspace 1/2"
            package: "@helbaron/app"
            args: "src/App.test.tsx"
            shard: "1/2"
          - label: "@helbaron/app, workspace 2/2"
            package: "@helbaron/app"
            args: "src/App.test.tsx"
            shard: "2/2"
          - label: "@helbaron/app, editor 1/2"
            package: "@helbaron/app"
            args: "src/components/CodeMirrorPaperSurface.test.tsx"
            shard: "1/2"
          - label: "@helbaron/app, editor 2/2"
            package: "@helbaron/app"
            args: "src/components/CodeMirrorPaperSurface.test.tsx"
            shard: "2/2"
          - label: "@helbaron/app, remaining 1/2"
            package: "@helbaron/app"
            args: "--exclude=src/App.test.tsx --exclude=src/components/CodeMirrorPaperSurface.test.tsx --shard=1/2"
            shard: ""
          - label: "@helbaron/app, remaining 2/2"
            package: "@helbaron/app"
            args: "--exclude=src/App.test.tsx --exclude=src/components/CodeMirrorPaperSurface.test.tsx --shard=2/2"
            shard: ""
          - label: "@helbaron/editor"
            package: "@helbaron/editor"
            args: ""
            shard: ""
          - label: "@helbaron/markdown"
            package: "@helbaron/markdown"
            args: ""
            shard: ""
          - label: "@helbaron/providers"
            package: "@helbaron/providers"
            args: ""
            shard: ""
          - label: "@helbaron/scripts"
            package: "@helbaron/scripts"
            args: ""
            shard: ""
          - label: "@helbaron/shared"
            package: "@helbaron/shared"
            args: ""
            shard: ""
          - label: "@helbaron/ui"
            package: "@helbaron/ui"
            args: ""
            shard: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        env:
          HELBARON_APP_TEST_SHARD: ${{ matrix.shard }}
        run: pnpm --filter "${{ matrix.package }}" test ${{ matrix.args }}

  frontend-test-typecheck:
    name: Frontend Test Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck tests
        run: pnpm run typecheck:test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - frontend-tests
      - frontend-test-typecheck
      - frontend-build
    if: always()

    steps:
      - name: Check frontend jobs
        run: |
          if [ "${{ needs.frontend-tests.result }}" != "success" ]; then
            echo "Frontend Tests result: ${{ needs.frontend-tests.result }}"
            exit 1
          fi
          if [ "${{ needs.frontend-test-typecheck.result }}" != "success" ]; then
            echo "Frontend Test Typecheck result: ${{ needs.frontend-test-typecheck.result }}"
            exit 1
          fi
          if [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "Frontend Build result: ${{ needs.frontend-build.result }}"
            exit 1
          fi

  tauri-rust:
    name: Tauri Rust (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> target

      - name: Check formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Test
        if: runner.os != 'Windows'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

      - name: Compile tests
        if: runner.os == 'Windows'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --no-run
